<!-- Paste the <head> block into V27's <head>, and the rest just before </body>. -->

<!-- ===== HEAD ===== -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14171B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Redline">
<link rel="apple-touch-icon" href="/redline_logo_transparent.png">

<!-- ===== BODY (before </body>) ===== -->
<style>
  .rl-sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,23,27,.42);padding:16px}
  .rl-card{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow-y:auto;background:#F3F1EC;color:#14171B;border-radius:32px;padding:32px 24px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
  .rl-top{display:flex;align-items:center;gap:32px}
  .rl-num{font-family:Fraunces,Georgia,serif;font-size:4.5rem;line-height:1;min-width:90px;font-weight:600;color:#D6402A}
  .rl-desc{max-width:280px;padding-right:16px;font-size:15px;line-height:1.5}
  .rl-bar{margin-top:24px;height:12px;border-radius:6px;background:#E4E0D6;overflow:hidden}
  .rl-bar>i{display:block;height:100%;background:#D6402A;border-radius:6px}
  .rl-trap{border-top:1px solid #E4E0D6;padding:20px 0}
  .rl-trap b{font-weight:600}
  .rl-trap p{margin:6px 0 0;color:#5A5D61;font-size:14px;line-height:1.5}
  .rl-fix{margin-top:10px;padding:12px 14px;background:#fff;border-left:3px solid #C9A86A;border-radius:8px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
  .rl-x{position:sticky;top:0;float:right;width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:#14171B;font-size:13px;line-height:22px;cursor:pointer;box-shadow:0 1px 4px rgba(20,23,27,.15)}
  .rl-cta{display:inline-block;margin-top:24px;background:#14171B;color:#F3F1EC;border:0;border-radius:999px;padding:14px 24px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
  .rl-a2hs{position:fixed;left:16px;right:16px;top:16px;z-index:70;margin:0 auto;max-width:420px;display:flex;align-items:center;gap:12px;background:#14171B;color:#F3F1EC;border-radius:999px;padding:10px 10px 10px 20px;font:500 14px Inter,system-ui,sans-serif;box-sizing:border-box}
  .rl-a2hs span{flex:1;min-width:0}
  .rl-a2hs button{border:0;border-radius:999px;padding:8px 14px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
  .rl-a2hs .go{background:#C9A86A;color:#14171B}
  .rl-a2hs .no{background:transparent;color:#F3F1EC;padding:8px}
</style>
<script>
(() => {
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {}));
  }

  // Hand a file to the page's own upload input so the normal auto-scan runs.
  function deliver(file) {
    const input = document.querySelector('input[type=file][accept*="pdf"]') || document.querySelector('input[type=file]');
    if (!input || !file) return;
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  // Desktop "Open with Redline".
  if ('launchQueue' in window) {
    launchQueue.setConsumer(async params => {
      if (params.files && params.files.length) deliver(await params.files[0].getFile());
    });
  }

  const q = new URLSearchParams(location.search);

  // Share sheet "Redline".
  if (q.get('source') === 'share' && 'caches' in window) {
    caches.open('redline-share').then(async c => {
      const r = await c.match('/shared-file');
      if (!r) return;
      const name = decodeURIComponent(r.headers.get('X-Filename') || 'contract.pdf');
      deliver(new File([await r.blob()], name, { type: r.headers.get('Content-Type') || '' }));
      c.delete('/shared-file');
    });
  }

  // Shortcuts.
  const action = q.get('action');
  if (action) addEventListener('load', () => {
    const el = document.getElementById(action) || document.querySelector(`[data-action="${action}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  });

  // Result link from SMS/email: /scan?id=87-perp.auto.indem
  const id = location.pathname.replace(/\/$/, '') === '/scan' && q.get('id');
  const m = id && id.match(/^(\d{1,2})-([a-z.]*)$/);
  if (m) {
    const risk = +m[1];
    const ids = m[2] ? m[2].split('.') : [];
    fetch('/api/traps').then(r => r.json()).then(kb => {
      const traps = ids.map(i => kb.find(t => t.id === i)).filter(Boolean);
      const sheet = document.createElement('div');
      sheet.className = 'rl-sheet';
      sheet.setAttribute('role', 'dialog');
      sheet.setAttribute('aria-label', 'Scan result');
      sheet.innerHTML = `<div class="rl-card">
        <button class="rl-x" aria-label="Close">&#x2715;</button>
        <div class="rl-top"><div class="rl-num">${risk}</div>
          <div class="rl-desc">${traps.length ? `${traps.length} trap${traps.length > 1 ? 's' : ''} found. Each has a safe rewrite.` : 'No known traps found.'}</div></div>
        <div class="rl-bar"><i style="width:${risk}%"></i></div>
        <div style="margin-top:24px">${traps.map(t => `<div class="rl-trap"><b>${esc(t.label)}</b><p>${esc(t.why)}</p><div class="rl-fix">${esc(t.fix)}</div></div>`).join('')}</div>
        <button class="rl-cta">Scan another contract</button>
      </div>`;
      const close = () => { sheet.remove(); history.replaceState(null, '', '/'); };
      sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('.rl-x')) close(); });
      sheet.querySelector('.rl-cta').addEventListener('click', () => {
        close();
        const input = document.querySelector('input[type=file]');
        if (input) input.click();
      });
      document.body.appendChild(sheet);
    }).catch(() => {});
  }

  // Add to Home Screen, offered once.
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || store.get('rl-a2hs')) return;
  function offer(label, onGo) {
    const bar = document.createElement('div');
    bar.className = 'rl-a2hs';
    bar.innerHTML = `<span>${label}</span>${onGo ? '<button class="go">Add</button>' : ''}<button class="no" aria-label="Dismiss">&#x2715;</button>`;
    const done = () => { bar.remove(); store.set('rl-a2hs', '1'); };
    bar.querySelector('.no').onclick = done;
    if (onGo) bar.querySelector('.go').onclick = () => { onGo(); done(); };
    document.body.appendChild(bar);
  }
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    setTimeout(() => offer('Add Redline to your Home Screen', () => e.prompt()), 20000);
  });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && /safari/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent)) {
    setTimeout(() => offer('Tap Share, then “Add to Home Screen”'), 20000);
  }
})();
</script>
